name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests use fake models, so they don't need torch, sentence-transformers or streamlit.
      - name: Install test dependencies
        run: pip install pypdf numpy openai python-dotenv pytest
      - name: Run tests
        run: pytest -q
